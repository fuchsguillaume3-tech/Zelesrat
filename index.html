
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZELESTAT RP Survival</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101411;color:white;font-family:Arial}
header{text-align:center;background:#202820;padding:15px;border-bottom:2px solid #a22}
h1{color:#d33;letter-spacing:5px;margin:0}
header p{color:#aaa;font-size:11px}
.stats{display:flex;justify-content:space-around;background:#202820;padding:12px;font-size:13px}
.stat{text-align:center;width:30%}
.bar{height:8px;background:#444;margin-top:5px;border-radius:8px;overflow:hidden}
.fill{height:100%;background:#d22;width:100%}
#stamina{background:#d9b32c}
#sceneBox{margin:12px;border:2px solid #65705e;border-radius:8px;overflow:hidden;position:relative}
#scene{width:100%;height:440px;object-fit:cover;display:block}
#sceneName{position:absolute;top:10px;left:10px;background:#111d;padding:8px;border-radius:5px}
#info{background:#202820;margin:12px;padding:15px;border-radius:7px;min-height:70px;line-height:1.5}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
button{background:#343f35;color:white;border:1px solid #66715e;border-radius:7px;padding:15px 5px;font-weight:bold;font-size:14px}
button:active{background:#922}
#inventory{background:#202820;margin:12px;padding:12px;border-radius:7px}
h3{color:#d6b46a}
footer{text-align:center;color:#777;padding:20px;font-size:11px}
</style>
</head>
<body>

<header>
<h1>ZELESTAT</h1>
<p>ROLEPLAY • SURVIVAL • ALSACE</p>
</header>

<div class="stats">
<div class="stat">❤️ SANTÉ <b id="hp">100</b>
<div class="bar"><div class="fill" id="health"></div></div></div>
<div class="stat">⚡ ENDURANCE <b id="sp">100</b>
<div class="bar"><div class="fill" id="stamina"></div></div></div>
<div class="stat">🕒 JOUR <b id="day">1</b><br><span id="clock">22:40</span></div>
</div>

<div id="sceneBox">
<img id="scene" src="scene1.jpg" alt="Sélestat zombie">
<div id="sceneName">Entrée de Sélestat</div>
</div>

<div id="info">
Tu arrives à Sélestat. La ville est tombée.
Explore les rues et tente de survivre.
</div>

<div class="actions">
<button onclick="advance()">➡️ AVANCER</button>
<button onclick="search()">🔎 FOUILLER</button>
<button onclick="observe()">👁️ OBSERVER</button>
<button onclick="rest()">💤 REPOS</button>
<button onclick="useBag()">🎒 UTILISER LE SAC</button>
<button onclick="restart()">↻ RECOMMENCER</button>
</div>

<div id="inventory">
<h3>🎒 INVENTAIRE</h3>
<div id="items">Nourriture : 0 | Bandages : 0</div>
</div>

<footer>ZELESTAT RP • SÉLESTAT ALSACE</footer>

<script>
const scenes=[
{
name:"Entrée de Sélestat",
image:"scene1.jpg",
text:"Le panneau annonce Sélestat. Un rôdeur erre près de la route. La ville semble abandonnée.",
loot:"Tu trouves une bouteille d'eau dans une voiture abandonnée."
},
{
name:"Rue commerçante",
image:"scene2.jpg",
text:"Tu arrives dans les rues commerçantes. Les vitrines sont brisées. Des zombies errent dans la rue.",
loot:"Tu trouves quelques conserves dans une boutique."
},
{
name:"Tour de Sélestat",
image:"scene3.jpg",
text:"La tour apparaît devant toi. Une barricade semble protéger quelques survivants.",
loot:"Tu récupères des bandages près de la barricade."
}
];

let step=0;
let hp=100,sp=100;
let day=1,minutes=1360;
let food=0,bandages=0;
let searched={};

function say(t){
document.getElementById("info").textContent=t;
}

function update(){
document.getElementById("hp").textContent=hp;
document.getElementById("sp").textContent=sp;
document.getElementById("health").style.width=hp+"%";
document.getElementById("stamina").style.width=sp+"%";
document.getElementById("day").textContent=day;
document.getElementById("clock").textContent=
String(Math.floor(minutes/60)%24).padStart(2,"0")+":"+
String(minutes%60).padStart(2,"0");
document.getElementById("items").textContent=
"Nourriture : "+food+" | Bandages : "+bandages;
}

function showScene(){
document.getElementById("scene").src=scenes[step].image;
document.getElementById("sceneName").textContent=
scenes[step].name+" ("+(step+1)+"/3)";
say(scenes[step].text);
update();
}

function time(){
minutes+=10;
if(minutes>=1440){
minutes-=1440;
day++;
}
}

function advance(){
if(step>=scenes.length-1){
say("Tu as atteint la barricade de Sélestat. Fin de cette aventure !");
return;
}
step++;
sp=Math.max(0,sp-5);
time();
showScene();
}

function search(){
if(searched[step]){
say("Tu as déjà fouillé cet endroit.");
return;
}
searched[step]=true;
if(step===2){
bandages++;
}else{
food++;
}
say(scenes[step].loot);
time();
update();
}

function observe(){
say(scenes[step].text);
}

function rest(){
sp=Math.min(100,sp+25);
time();
say("Tu reprends ton souffle.");
update();
}

function useBag(){
if(bandages>0&&hp<100){
bandages--;
hp=Math.min(100,hp+35);
say("Tu utilises un bandage. Santé restaurée.");
}else if(food>0&&sp<100){
food--;
sp=Math.min(100,sp+35);
say("Tu manges. Ton endurance remonte.");
}else{
say("Tu n'as rien à utiliser.");
}
update();
}

function restart(){
step=0;
hp=100;
sp=100;
day=1;
minutes=1360;
food=0;
bandages=0;
searched={};
showScene();
}

showScene();
</script>
</body>
</html>
