
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sélestat Zombie Map</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#151b20;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#202a30;padding:14px;
 text-align:center;
}
h2{margin:0 0 5px}
.controls{
 display:flex;flex-wrap:wrap;gap:7px;
 padding:10px;background:#263238;
}
button,select{
 padding:10px;border:0;border-radius:6px;
 background:#46545c;color:white;font-weight:bold;
}
button:active{background:#84cc16}
#viewport{
 width:100%;height:72vh;overflow:auto;
 background:#111;
 touch-action:pan-x pan-y;
}
#map{
 position:relative;width:100%;line-height:0;
}
#map img{
 width:100%;height:auto;display:block;
 pointer-events:none;
}
#pawns{
 position:absolute;inset:0;
}
.pawn{
 position:absolute;
 transform:translate(-50%,-50%);
 width:36px;height:36px;
 border:3px solid white;
 border-radius:50%;
 display:flex;align-items:center;
 justify-content:center;
 font-weight:bold;font-size:17px;
 color:#111;cursor:grab;
 touch-action:none;
 line-height:normal;
 user-select:none;
}
.blue{background:#38bdf8}
.red{background:#ef4444}
.green{background:#4ade80}
.yellow{background:#facc15}
#list{padding:12px}
.item{
 display:flex;justify-content:space-between;
 align-items:center;padding:8px;
 background:#263238;margin:5px 0;
 border-radius:6px;
}
.item button{padding:5px 10px}
</style>
</head>

<body>

<header>
<h2>🧟 SÉLESTAT SURVIVAL</h2>
<div>Carte interactive Project Zomboid</div>
</header>

<div class="controls">

<select id="mapChoice" onchange="changeMap()">
<option value="selestat-aerienne.jpg">Vue satellite</option>
<option value="parcours-arbres.jpg">Plan de Sélestat</option>
</select>

<button onclick="addPawn('blue')">+ Survivant</button>
<button onclick="addPawn('red')">+ Zombie</button>
<button onclick="addPawn('green')">+ Groupe</button>
<button onclick="addPawn('yellow')">+ Objectif</button>

<button onclick="zoom(1.2)">Zoom +</button>
<button onclick="zoom(0.8)">Zoom -</button>
<button onclick="resetZoom()">Reset</button>

</div>

<div id="viewport">
 <div id="map">
  <img id="mapImage" src="selestat-aerienne.jpg">
  <div id="pawns"></div>
 </div>
</div>

<div id="list">
<h3>📍 Gestion des pions</h3>
<div id="pawnList"></div>
<button onclick="clearPawns()" style="background:#a32626">
Supprimer tous les pions
</button>
</div>

<script>

let pawns=[];
let counter=1;
let scale=1;

try{
 pawns=JSON.parse(localStorage.getItem("selestatPawns")||"[]");
 counter=Math.max(0,...pawns.map(p=>p.id))+1;
}catch(e){pawns=[];}

const types={
 blue:{icon:"S",name:"Survivant"},
 red:{icon:"Z",name:"Zombie"},
 green:{icon:"G",name:"Groupe"},
 yellow:{icon:"!",name:"Objectif"}
};

function save(){
 localStorage.setItem("selestatPawns",JSON.stringify(pawns));
 render();
}

function changeMap(){
 document.getElementById("mapImage").src=
 document.getElementById("mapChoice").value;
}

function addPawn(type){
 pawns.push({
  id:counter++,
  type:type,
  x:50,
  y:50,
  name:types[type].name
 });
 save();
}

function render(){

 const container=document.getElementById("pawns");
 container.innerHTML="";

 pawns.forEach(p=>{

  let el=document.createElement("div");
  el.className="pawn "+p.type;
  el.textContent=types[p.type].icon;
  el.style.left=p.x+"%";
  el.style.top=p.y+"%";

  let dragging=false;

  el.addEventListener("pointerdown",e=>{
   e.preventDefault();
   dragging=true;
   el.setPointerCapture(e.pointerId);
  });

  el.addEventListener("pointermove",e=>{
   if(!dragging)return;

   const rect=document.getElementById("map").getBoundingClientRect();

   p.x=Math.max(0,Math.min(100,
    (e.clientX-rect.left)/rect.width*100));

   p.y=Math.max(0,Math.min(100,
    (e.clientY-rect.top)/rect.height*100));

   el.style.left=p.x+"%";
   el.style.top=p.y+"%";
  });

  el.addEventListener("pointerup",()=>{
   dragging=false;
   localStorage.setItem("selestatPawns",JSON.stringify(pawns));
  });

  el.addEventListener("dblclick",()=>{
   renamePawn(p.id);
  });

  container.appendChild(el);
 });

 renderList();
}

function renderList(){

 const list=document.getElementById("pawnList");
 list.innerHTML="";

 pawns.forEach(p=>{

  let item=document.createElement("div");
  item.className="item";

  let name=document.createElement("span");
  name.textContent=types[p.type].name+" : "+p.name;

  let edit=document.createElement("button");
  edit.textContent="✏️";
  edit.onclick=()=>renamePawn(p.id);

  let del=document.createElement("button");
  del.textContent="❌";
  del.onclick=()=>{
   pawns=pawns.filter(x=>x.id!==p.id);
   save();
  };

  item.append(name,edit,del);
  list.appendChild(item);
 });
}

function renamePawn(id){
 let p=pawns.find(x=>x.id===id);
 if(!p)return;
 let name=prompt("Nom du pion :",p.name);
 if(name && name.trim()){
  p.name=name.trim();
  save();
 }
}

function clearPawns(){
 if(confirm("Supprimer tous les pions ?")){
  pawns=[];
  save();
 }
}

function zoom(value){
 scale=Math.max(0.5,Math.min(3,scale*value));
 document.getElementById("map").style.width=(scale*100)+"%";
}

function resetZoom(){
 scale=1;
 document.getElementById("map").style.width="100%";
}

render();

</script>

</body>
</html>
